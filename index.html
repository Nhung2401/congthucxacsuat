<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá Công thức cộng Xác suất</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        #canvas-container {
            width: 800px;
            height: 400px;
            background-color: white;
            border: 3px solid #bdc3c7;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            position: absolute;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            /* Hiệu ứng hòa trộn màu để tạo ra màu tím khi đè lên nhau */
            mix-blend-mode: multiply; 
            transition: transform 0.1s;
            user-select: none;
        }
        .circle:active {
            cursor: grabbing;
            transform: scale(1.05);
        }
        #circleA {
            background-color: rgba(52, 152, 219, 0.8); /* Màu xanh */
            left: 100px;
            top: 80px;
        }
        #circleB {
            background-color: rgba(231, 76, 60, 0.8); /* Màu đỏ */
            left: 460px;
            top: 80px;
        }
        #formula-box {
            margin-top: 30px;
            padding: 20px 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 600px;
            transition: all 0.3s ease;
        }
        .status {
            font-size: 24px;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .intersection-text {
            font-size: 32px;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            color: #8e44ad; /* Màu tím để khớp với màu phần giao */
            margin-bottom: 15px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .math-text {
            font-size: 38px;
            font-style: italic;
            font-family: 'Times New Roman', Times, serif;
            color: #2c3e50;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
            animation: popIn 0.5s ease-out;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            50% { transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>HỌC LIỆU TƯƠNG TÁC: CÔNG THỨC CỘNG XÁC SUẤT</h2>
    
    <div id="canvas-container">
        <div id="circleA" class="circle">A</div>
        <div id="circleB" class="circle">B</div>
    </div>

    <div id="formula-box">
        <div id="status-text" class="status">Hai biến cố XUNG KHẮC</div>
        <div id="intersection-text" class="intersection-text">A &cap; B = &empty;</div>
        <div id="formula-text" class="math-text">P(A &cup; B) = P(A) + P(B)</div>
    </div>

    <script>
        const circleA = document.getElementById('circleA');
        const circleB = document.getElementById('circleB');
        const statusText = document.getElementById('status-text');
        const intersectionText = document.getElementById('intersection-text');
        const formulaText = document.getElementById('formula-text');

        function checkOverlap() {
            const rectA = circleA.getBoundingClientRect();
            const rectB = circleB.getBoundingClientRect();

            const radiusA = rectA.width / 2;
            const radiusB = rectB.width / 2;

            const centerX_A = rectA.left + radiusA;
            const centerY_A = rectA.top + radiusA;
            const centerX_B = rectB.left + radiusB;
            const centerY_B = rectB.top + radiusB;

            const distance = Math.sqrt(Math.pow(centerX_A - centerX_B, 2) + Math.pow(centerY_A - centerY_B, 2));

            // Nếu cắt nhau
            if (distance < radiusA + radiusB) {
                statusText.innerHTML = "Hai biến cố <span style='color:#e74c3c'>KHÔNG XUNG KHẮC</span>";
                intersectionText.innerHTML = "A &cap; B &ne; &empty;"; // Kí hiệu khác rỗng
                formulaText.innerHTML = "P(A &cup; B) = P(A) + P(B) <span class='highlight'>- P(AB)</span>";
                document.getElementById('formula-box').style.borderBottom = "5px solid #e74c3c";
            } else {
                statusText.innerHTML = "Hai biến cố <span style='color:#3498db'>XUNG KHẮC</span>";
                intersectionText.innerHTML = "A &cap; B = &empty;"; // Kí hiệu bằng rỗng
                formulaText.innerHTML = "P(A &cup; B) = P(A) + P(B)";
                document.getElementById('formula-box').style.borderBottom = "5px solid #3498db";
            }
        }

        // Logic kéo thả (Hỗ trợ cả chuột trên máy tính và cảm ứng trên Smartboard)
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            element.addEventListener('touchstart', dragStart, {passive: false});
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true;
                if (e.type === 'touchstart') {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
                element.style.zIndex = 10; 
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault(); 
                
                let currentX, currentY;
                if (e.type === 'touchmove') {
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                } else {
                    currentX = e.clientX;
                    currentY = e.clientY;
                }

                let dx = currentX - startX;
                let dy = currentY - startY;

                element.style.left = (initialLeft + dx) + 'px';
                element.style.top = (initialTop + dy) + 'px';

                checkOverlap();
            }

            function dragEnd() {
                isDragging = false;
                element.style.zIndex = 1;
            }
        }

        makeDraggable(circleA);
        makeDraggable(circleB);
        checkOverlap();
    </script>
</body>
</html>
